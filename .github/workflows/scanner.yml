name: Scanner (Hourly)

on:
  schedule:
    # تشغيل مرة كل ساعة، عند الدقيقة 7 لتجنب ضغط بداية الساعة
    - cron: '7 * * * *'

  # تشغيل يدوي من Actions
  workflow_dispatch: {}

permissions:
  contents: read

# يمنع تشغيل دورتين من تعديل نفس حالة المحفظة في نفس الوقت.
# لا يلغي الدورة السابقة.
concurrency:
  group: okx-quant-portfolio-state
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    # 40 دقيقة لأن بعض الدورات قد تقترب من 30 دقيقة.
    timeout-minutes: 40

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: |
          python -m pytest -q > "$RUNNER_TEMP/tests.log" 2>&1 \
            || {
              echo "::error::Tests failed"
              cat "$RUNNER_TEMP/tests.log"
              exit 1
            }

      - name: Run scanner with retry
        working-directory: app
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "=========================================="
            echo "Scanner attempt $attempt/3"
            echo "=========================================="

            if python okx_quant/okx_quant_scanner.py > "$RUNNER_TEMP/run.log" 2>&1; then
              echo "Scanner completed successfully."
              exit 0
            fi

            echo "::warning::Scanner attempt $attempt failed."

            cat "$RUNNER_TEMP/run.log"

            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

          echo "::error::Scanner failed after 3 attempts."
          cat "$RUNNER_TEMP/run.log"
          exit 1
