name: Zied Quant Strategy Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/strategy-performance-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  strategy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: zied-quant-read-only-strategy-tests
      cancel-in-progress: false
    steps:
      - name: Checkout private Zied app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile AI and strategy audit modules
        working-directory: app
        run: |
          set -euo pipefail
          python -m py_compile \
            okx_quant/historical_ai.py \
            okx_quant/weekly_learning.py \
            okx_quant/audit_strategy_performance.py \
            okx_quant/audit_strategy_oos_performance.py \
            okx_quant/test_ai_model_promotion.py

      - name: Test AI champion promotion thresholds
        working-directory: app
        env:
          PYTHONPATH: okx_quant
        run: |
          set -euo pipefail
          pytest -q okx_quant/test_ai_model_promotion.py

      - name: Audit realized performance for all registered strategies
        working-directory: app
        env:
          PYTHONPATH: okx_quant
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python okx_quant/audit_strategy_performance.py | tee strategy_performance_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("strategy_performance_audit.json").read_text())
          assert report.get("status") == "OK", "Strategy performance audit did not return OK"
          assert report.get("strategiesReported", 0) >= report.get("registryStrategies", 0), "Not all registered strategies were reported"
          print(
              "STRATEGY_AUDIT_SUMMARY "
              f"registered={report.get('registryStrategies')} "
              f"reported={report.get('strategiesReported')} "
              f"closed_trades={report.get('closedLedgerRows')} "
              f"valid_pnl_trades={report.get('validPnlTrades')} "
              f"strategies_with_trades={report.get('strategiesWithObservedTrades')} "
              f"strategies_with_8plus_trades={report.get('strategiesWithAtLeast8Trades')}"
          )
          PY

      - name: Run walk-forward out-of-sample strategy audit
        working-directory: app
        env:
          PYTHONPATH: okx_quant
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python okx_quant/audit_strategy_oos_performance.py \
            --max-symbols 20 \
            --candles 1500 \
            --output strategy_oos_performance_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("strategy_oos_performance_audit.json").read_text())
          print(
              "OOS_AUDIT_SUMMARY "
              f"strategies={report.get('strategiesReported', report.get('strategyCount', 'unknown'))} "
              f"symbols={report.get('successfulSymbols', report.get('symbolsEvaluated', 'unknown'))} "
              f"errors={report.get('evaluationErrors', 'unknown')}"
          )
          PY

      - name: Upload strategy audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zied-quant-strategy-tests-${{ github.run_id }}
          path: |
            app/strategy_performance_audit.json
            app/strategy_oos_performance_audit.json
          if-no-files-found: warn
          retention-days: 30
