name: Daily Learning

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Serialize learning with scanner/backtest state updates in the shared app repo.
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required persisted state
        working-directory: app
        run: |
          set -euo pipefail
          for pattern in 'ml_model_memory_*.json' 'analysis_memory_*.json' 'strategy_stats_*.json'; do
            file="$(find . -maxdepth 2 -type f -name "$pattern" -size +0c -print -quit)"
            if [ -z "$file" ]; then
              echo "ERROR: required learning state missing or empty: $pattern"
              exit 1
            fi
            echo "Found $pattern at $file"
          done

      - name: Run daily learning
        working-directory: app
        run: |
          set -o pipefail
          python okx_quant/weekly_learning.py 2>&1 | tee "${RUNNER_TEMP}/daily-learning.log"

      - name: Upload daily learning log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-learning-log-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-learning.log
          if-no-files-found: ignore
          retention-days: 14
