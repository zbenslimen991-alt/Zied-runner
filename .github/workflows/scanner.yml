name: Scanner (Every 30 Minutes)

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Skip backup schedule if a run started recently
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          go=true
          if [ "$EVENT" = "schedule" ]; then
            since=$(date -u -d '25 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api --method GET "repos/$REPO/actions/workflows/scanner.yml/runs" \
                  -f created=">=$since" -f per_page=50 \
                  --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length" || echo 0)
            echo "recent runs: $n"
            if [ "${n:-0}" -gt 0 ]; then go=false; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  run-scanner:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run scanner
        working-directory: app
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          python okx_quant/okx_quant_scanner.py 2>&1 | tee "$RUNNER_TEMP/run.log"

      - name: Reliability report
        if: always()
        working-directory: app
        run: |
          python - <<'PY'
          from pathlib import Path
          from reliability import scan_log_text, format_report
          p = Path("${{ runner.temp }}/run.log")
          metrics = scan_log_text(p.read_text(errors="ignore") if p.exists() else "")
          print(format_report(metrics))
          PY
      - name: Upload scanner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-log-${{ github.run_id }}
          path: ${{ runner.temp }}/run.log
          if-no-files-found: ignore
          retention-days: 7
