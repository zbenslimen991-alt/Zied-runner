name: Telegram promo (every 4 hours)

on:
  schedule:
    # Every 4 hours (UTC); Tunisia local time is UTC+1.
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-promo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish promotional message to public channel only
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TG_TOKEN:-}" ]; then
            echo "Missing TG_TOKEN secret"
            exit 1
          fi
          if [ -z "${TG_CHANNEL_ID:-}" ]; then
            echo "Missing TG_CHANNEL_ID secret"
            exit 1
          fi

          MESSAGE=$(printf '%s\n' \
            '━━━━━━━━━━━━━━━━━━━━' \
            '🚀 ZIED QUANT' \
            '🤖 منصة ذكية لتحليل سوق العملات الرقمية' \
            '━━━━━━━━━━━━━━━━━━━━' \
            '' \
            '📊 اكتشف طريقة أكثر تطورًا لمتابعة سوق العملات الرقمية!' \
            '' \
            '🧠 الذكاء الاصطناعي والتعلّم من البيانات' \
            'تحليل نتائج الاختبارات التاريخية وتقييم أداء الاستراتيجيات للمساعدة في تطوير عملية الاختيار.' \
            '' \
            '📈 ماسح ذكي للعملات الرقمية' \
            'مراقبة أزواج OKX Spot وتحليل الأسعار والشموع لاكتشاف الفرص التي تتوافق مع شروط الاستراتيجيات.' \
            '' \
            '🎯 أكثر من 200 استراتيجية تحليلية' \
            'تنوع في أساليب التحليل ومقارنة أداء الاستراتيجيات وفق البيانات المتاحة.' \
            '' \
            '🔬 اختبارات تاريخية متقدمة (Backtesting)' \
            'دراسة نتائج الاستراتيجيات والصفقات التاريخية ومعدلات النجاح وأسباب الخروج لاكتشاف نقاط القوة والضعف.' \
            '' \
            '⚙️ متابعة الصفقات وإدارة المخاطر' \
            'متابعة الدخول والخروج وأهداف الربح ووقف الخسارة وفق قواعد النظام.' \
            '' \
            '🧠 اختيار الاستراتيجيات ومراقبة أدائها' \
            'تقييم الاستراتيجيات ومتابعة تغير أدائها مع اختلاف ظروف السوق.' \
            '' \
            '🌍 أخبار العملات الرقمية' \
            'متابعة الأخبار المهمة ومستويات مخاطر السوق والأحداث التي قد تؤثر في الأسعار.' \
            '' \
            '📱 لوحة تحكم متكاملة' \
            'تابع إشارات السوق والصفقات وأداء الاستراتيجيات ونتائج الاختبارات في واجهة واحدة.' \
            '' \
            '━━━━━━━━━━━━━━━━━━━━' \
            '💎 الاشتراك الشهري: 30$' \
            '📩 للاشتراك والاستفسار: @ziedbns2' \
            '━━━━━━━━━━━━━━━━━━━━' \
            '' \
            '📢 تابع القناة العامة لأخبار السوق وتحديثات Zied Quant والإعلانات الدورية.')

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHANNEL_ID}" \
            --data-urlencode "text=${MESSAGE}")

          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print("Telegram response:", d.get("description", "ok")); sys.exit(0 if d.get("ok") else 1)'
