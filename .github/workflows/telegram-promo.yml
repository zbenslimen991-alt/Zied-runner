name: Telegram Promo

on:
  schedule:
    # GitHub Actions cron uses UTC; runs every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-promo
  cancel-in-progress: false

jobs:
  send-promo:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Zied Quant promotional message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID repository secrets."
            exit 1
          fi

          MESSAGE=$(cat <<'EOF'
          🚀 Zied Quant | تحليل ذكي لأسواق العملات الرقمية

          🤖 200 استراتيجية للتحليل والتقييم، مع أدوات التحليل الفني، تقييم الأداء، Backtesting، والتداول الورقي، ومراقبة المخاطر والتعلم من بيانات الصفقات المغلقة.

          📊 مؤشرات التحليل الفني تشمل أدوات الاتجاه والزخم والتقلب والحجم؛ وتختلف الأدوات حسب الاستراتيجية.

          💎 الاشتراك الشهري: 30$
          📩 للتواصل والاشتراك: @ziedbns2

          Zied Quant 
          EOF
          )

          RESPONSE=$(curl --fail-with-body --silent --show-error --get \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true")

          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print("Telegram API ok:", d.get("ok", False)); sys.exit(0 if d.get("ok") else 1)'
