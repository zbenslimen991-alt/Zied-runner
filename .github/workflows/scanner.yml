name: Scanner (Hourly)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Skip backup schedule if a run started recently
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          go=true
          if [ "$EVENT" = "schedule" ]; then
            since=$(date -u -d '45 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api --method GET "repos/$REPO/actions/workflows/scanner.yml/runs" \
                  -f created=">=$since" -f per_page=50 \
                  --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length" || echo 0)
            echo "recent runs: $n"
            if [ "${n:-0}" -gt 0 ]; then go=false; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  run-scanner:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run scanner
        working-directory: app
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          python okx_quant/okx_quant_scanner.py 2>&1 | tee "$RUNNER_TEMP/run.log"

      - name: Upload scanner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-log-${{ github.run_id }}
          path: ${{ runner.temp }}/run.log
          if-no-files-found: ignore
          retention-days: 7

  chain:
    needs: [gate, run-scanner]
    if: ${{ always() && needs.gate.outputs.go == 'true' && needs.run-scanner.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Wait until next HH:07 (UTC) then dispatch next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%Y-%m-%dT%H):07:00" +%s)
          if [ "$target" -le $((now + 120)) ]; then target=$((target + 3600)); fi
          wait=$((target - now))
          echo "sleeping ${wait}s until $(date -u -d @$target +%H:%M) UTC"
          sleep "$wait"

          sleep $((RANDOM % 25))
          since=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api --method GET "repos/$REPO/actions/workflows/scanner.yml/runs" \
                -f created=">=$since" -f per_page=50 \
                --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length" || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "another run already started; not dispatching"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            echo "Dispatch attempt $attempt/5"
            if gh workflow run scanner.yml --repo "$REPO" --ref main; then
              echo "Next run dispatched successfully."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 20; fi
          done
          echo "::error::Unable to dispatch next scanner run after 5 attempts"
          exit 1
