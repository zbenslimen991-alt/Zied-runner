name: Scanner (Every 30 Minutes)

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/scanner.yml'

permissions:
  contents: read
  actions: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Sync latest validated backtest state
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          BACKTEST_REPO="zbenslimen991-alt/Zied-backtest"
          RUN_ID="$(gh run list --repo "$BACKTEST_REPO" --workflow backtest.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful weekly backtest run found; refusing to run with unknown state."
            exit 1
          fi
          rm -rf .backtest-state-sync
          mkdir -p .backtest-state-sync
          gh run download "$RUN_ID" --repo "$BACKTEST_REPO" --name quant-state --dir .backtest-state-sync
          STATE_DIR=".backtest-state-sync/quant-state"
          if [ ! -d "$STATE_DIR" ]; then
            STATE_DIR=".backtest-state-sync"
          fi
          for f in backtest_results.json ml_model_memory.json analysis_memory.json strategy_stats.json; do
            if [ -f "$STATE_DIR/$f" ]; then
              cp "$STATE_DIR/$f" "$f"
              echo "Synced $f"
            else
              echo "Missing state file: $f"
            fi
          done
          rm -rf .backtest-state-sync
          test -s backtest_results.json
          echo "Backtest state synchronization: OK (run $RUN_ID)"

      - name: Run tests
        working-directory: app
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run scanner
        working-directory: app
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          python okx_quant/okx_quant_scanner.py 2>&1 | tee "$RUNNER_TEMP/run.log"

      - name: Reliability report
        if: always()
        working-directory: app
        run: |
          python - <<'PY'
          from pathlib import Path
          from okx_quant.reliability import scan_log_text, format_report
          p = Path("${{ runner.temp }}/run.log")
          metrics = scan_log_text(p.read_text(errors="ignore") if p.exists() else "")
          print(format_report(metrics))
          PY
      - name: Reliability gate
        if: always()
        working-directory: app
        run: |
          python - <<'PY'
          from pathlib import Path
          from okx_quant.reliability import scan_log_text, format_report, has_unhandled_runtime_error
          p = Path("${{ runner.temp }}/run.log")
          log_text = p.read_text(errors="ignore") if p.exists() else ""
          metrics = scan_log_text(log_text)
          print(format_report(metrics))
          if has_unhandled_runtime_error(log_text):
              print("Reliability gate: unhandled scanner-level runtime error detected.")
              raise SystemExit(1)
          print("Reliability gate: OK (handled network/API diagnostics do not fail the gate)")
          PY

      - name: Upload scanner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-log-${{ github.run_id }}
          path: ${{ runner.temp }}/run.log
          if-no-files-found: ignore
          retention-days: 7
