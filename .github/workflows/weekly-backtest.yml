name: Weekly Backtest

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  weekly-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: python -m pytest -q

      - name: Run weekly Backtest / Walk-Forward
        working-directory: app
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_WEEKLY_BACKTEST: "1"
        run: |
          set -o pipefail
          python okx_quant/weekly_backtest.py 2>&1 | tee "$RUNNER_TEMP/weekly-backtest.log"

      - name: Upload weekly Backtest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-backtest-log-${{ github.run_id }}
          path: ${{ runner.temp }}/weekly-backtest.log
          if-no-files-found: ignore
          retention-days: 14
