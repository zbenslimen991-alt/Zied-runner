name: Zied Quant OKX Spot promo (every 6 hours)

on:
  schedule:
    # Every 4 hours (UTC); Tunisia local time is UTC+1.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-promo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish promotional message to public channel only
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TG_TOKEN:-}" ]; then
            echo "Missing TG_TOKEN secret"
            exit 1
          fi
          if [ -z "${TG_CHANNEL_ID:-}" ]; then
            echo "Missing TG_CHANNEL_ID secret"
            exit 1
          fi

          MESSAGE=$(printf '%s\n' \
            '━━━━━━━━━━━━━━━━━━━━' \
            '🪙 Zied Quant — OKX Spot' \
            '━━━━━━━━━━━━━━━━━━━━' \
            '' \
            'يدعم Zied Quant التداول الفوري (Spot) على منصة OKX، مع متابعة أسعار العملات وتحليل الاستراتيجيات وإدارة المراكز المفتوحة ومراقبة الأرباح والخسائر.' \
            '' \
            '📊 متابعة أسعار السوق وتحليل الإشارات والاستراتيجيات.' \
            '💰 عرض رأس المال المستثمر والربح أو الخسارة العائمة ونسبة التغيّر.' \
            '🎯 متابعة أهداف جني الأرباح ووقف الخسارة عند استخدامها من الاستراتيجية.' \
            '🧠 تقييم الاستراتيجيات وتحليل بيانات السوق.' \
            '📈 لوحة تحكم لمتابعة المراكز والأوامر ونتائج الأداء.' \
            '' \
            '⚙️ مخصص لتداول Spot وليس Futures؛ لا يعتمد على الرافعة المالية أو مراكز العقود الآجلة.' \
            '' \
            '💎 الاشتراك الشهري: 30$' \
            '📩 للاشتراك والاستفسار: @ziedbns2' \
            '━━━━━━━━━━━━━━━━━━━━' \
            '⚠️ التداول ينطوي على مخاطر، ولا توجد أرباح مضمونة.')

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHANNEL_ID}" \
            --data-urlencode "text=${MESSAGE}")

          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print("Telegram response:", d.get("description", "ok")); sys.exit(0 if d.get("ok") else 1)'
