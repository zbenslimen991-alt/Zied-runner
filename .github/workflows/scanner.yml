# V62 validation trigger: test advisory global news intelligence integration
# V61 validation trigger: run tests for operations guard and paper/backtest reconciliation
# V56 adaptive exploration validation: run latest Paper-Trading learning path
# V53 diagnostic trigger: distinguish native AI V2 pass from soft fallback eligibility
      # V54 validation: evidence consensus + conservative risk fallback
# V41b validation trigger: limited backtest evidence tier
# V41 integration test trigger: AI V2 soft-pass + quant-state validation
name: Scanner (Restart After Each Run)

# Run one analysis cycle per workflow. When this run finishes, dispatch the next run.
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/scanner.yml'

permissions:
  contents: read
  actions: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          ref: main
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Diagnose active news source version
        working-directory: app
        run: |
          set -euo pipefail
          echo "=== Active application checkout ==="
          git remote -v || true
          git rev-parse HEAD
          echo "=== News source count in the code actually being executed ==="
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path("okx_quant/news_intelligence.py")
          if not path.exists():
              raise SystemExit(f"ERROR: {path} is missing from APP_REPO checkout")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))
          feeds = next(
              (node.value for node in tree.body
               if isinstance(node, ast.Assign)
               and any(isinstance(target, ast.Name) and target.id == "FEEDS" for target in node.targets)),
              None,
          )
          if not isinstance(feeds, (ast.Tuple, ast.List)):
              raise SystemExit("ERROR: FEEDS list was not found in the checked-out source")
          names = [
              item.elts[0].value for item in feeds.elts
              if isinstance(item, ast.Tuple) and len(item.elts) >= 2
              and isinstance(item.elts[0], ast.Constant)
          ]
          print(f"NEWS_FEED_COUNT={len(names)}")
          print("NEWS_FEED_NAMES=" + ", ".join(names))
          if len(names) < 30:
              raise SystemExit(
                  f"ERROR: active APP_REPO checkout has only {len(names)} news sources; "
                  "expected at least 30. The scanner is checking out a stale/different code version."
              )
          PY

      - name: Validate latest quant state
        working-directory: app
        run: |
          set -euo pipefail

          latest_state_file() {
            local pattern="$1"
            find . -maxdepth 1 -type f -name "$pattern" -printf '%T@ %p\n' 2>/dev/null               | sort -nr               | head -n 1               | cut -d' ' -f2-
          }

          validate_state() {
            local label="$1"
            local pattern="$2"
            local file
            file="$(latest_state_file "$pattern")"
            if [ -z "$file" ] || [ ! -s "$file" ]; then
              echo "ERROR: $label state is missing or empty (pattern $pattern)"
              exit 1
            fi
            echo "Validated $label: $file ($(wc -c < "$file") bytes)"
          }

          validate_state "Backtest" "backtest_results_*.json"
          validate_state "ML model" "ml_model_memory_*.json"
          validate_state "Analysis memory" "analysis_memory_*.json"
          validate_state "Strategy stats" "strategy_stats_*.json"

          echo "Quant state validation: OK"
          echo "The scanner loads these rotated files through state.py/storage_rotation.py."

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run one scanner cycle
        working-directory: app
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          ZIED_ANALYSIS_WORKERS: '12'
        run: |
          set -o pipefail
          python okx_quant/okx_quant_scanner.py 2>&1 | tee "$RUNNER_TEMP/run.log"

      - name: Reliability report
        if: always()
        working-directory: app
        run: |
          python - <<'PY'
          from pathlib import Path
          from okx_quant.reliability import scan_log_text, format_report
          p = Path("${{ runner.temp }}/run.log")
          metrics = scan_log_text(p.read_text(errors="ignore") if p.exists() else "")
          print(format_report(metrics))
          PY

      - name: Reliability gate
        if: always()
        working-directory: app
        run: |
          python - <<'PY'
          from pathlib import Path
          from okx_quant.reliability import scan_log_text, format_report, has_unhandled_runtime_error
          p = Path("${{ runner.temp }}/run.log")
          log_text = p.read_text(errors="ignore") if p.exists() else ""
          metrics = scan_log_text(log_text)
          print(format_report(metrics))
          if has_unhandled_runtime_error(log_text):
              print("Reliability gate: unhandled scanner-level runtime error detected.")
              raise SystemExit(1)
          print("Reliability gate: OK (handled network/API diagnostics do not fail the gate)")
          PY

      - name: Upload scanner log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-log-${{ github.run_id }}
          path: ${{ runner.temp }}/run.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Start next workflow after this run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run scanner.yml --repo zbenslimen991-alt/Zied-runner --ref main
          echo "Queued the next workflow run."
