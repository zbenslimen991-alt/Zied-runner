name: Scanner Auto-Restart

on:
  workflow_run:
    workflows:
      - Scanner (Every 30 Minutes)
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  start-next-scan:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start the next scanner run immediately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$REPOSITORY/actions/workflows/scanner.yml/dispatches" \
            -f ref=main
          echo "Next scanner run dispatched."
