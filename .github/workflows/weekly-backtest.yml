name: Weekly Backtest Cache Refresh

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: "Batch index to resume (normally leave at 0)"
        required: false
        default: "0"
        type: string
  schedule:
    - cron: "0 2 * * 1"
  push:
    paths:
      - ".github/workflows/weekly-backtest.yml"

permissions:
  contents: read
  actions: write

# Serialize all writers of the Zied state repository with the scanner workflow.
concurrency:
  group: okx-quant-portfolio-state
  cancel-in-progress: false

jobs:
  weekly-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          ref: main
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run one full-universe backtest batch
        id: backtest
        working-directory: app
        env:
          FORCE_WEEKLY_BACKTEST: "1"
          BACKTEST_BATCH_SIZE: "20"
          BACKTEST_BATCH_INDEX: ${{ inputs.batch_index || '0' }}
        run: |
          set -uo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "=== Weekly backtest batch ${BACKTEST_BATCH_INDEX}; attempt ${attempt}/3 ==="
            if python okx_quant/weekly_backtest.py 2>&1 | tee -a "$RUNNER_TEMP/weekly-backtest.log"; then
              success=1
              break
            fi
            echo "Batch attempt ${attempt} failed; persisted checkpoints will be reused on retry."
          done
          if [ "$success" -ne 1 ]; then
            echo "Weekly backtest batch failed after 3 attempts."
            exit 1
          fi

      - name: Upload weekly backtest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-backtest-log-${{ github.run_id }}
          path: ${{ runner.temp }}/weekly-backtest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Continue with next batch or resume scanner
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_BATCH_INDEX: ${{ steps.backtest.outputs.next_batch_index }}
          IS_LAST_BATCH: ${{ steps.backtest.outputs.is_last_batch }}
        run: |
          set -euo pipefail
          if [ "$IS_LAST_BATCH" = "true" ]; then
            echo "Full-universe weekly backtest completed; resuming scanner."
            gh workflow run scanner.yml --repo zbenslimen991-alt/Zied-runner --ref main
          else
            echo "Queueing next weekly backtest batch: $NEXT_BATCH_INDEX"
            gh workflow run weekly-backtest.yml --repo zbenslimen991-alt/Zied-runner --ref main -f batch_index="$NEXT_BATCH_INDEX"
          fi

      - name: Resume scanner after an unrecoverable backtest batch
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Backtest batch could not finish after retries; resume scanner without advancing the failed batch."
          gh workflow run scanner.yml --repo zbenslimen991-alt/Zied-runner --ref main
