name: Telegram promo (2x daily)

on:
  schedule:
    # GitHub Actions uses UTC: 08:00 and 17:00 UTC = 09:00 and 18:00 Tunisia time
    - cron: '0 8,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-promo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish promotional message to public channel only
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TG_TOKEN:-}" ]; then
            echo "Missing TG_TOKEN secret"
            exit 1
          fi
          if [ -z "${TG_CHANNEL_ID:-}" ]; then
            echo "Missing TG_CHANNEL_ID secret"
            exit 1
          fi

          MESSAGE=$(printf '%s\n' \
            '🚀 Zied Quant Traide | منصة تحليل العملات الرقمية' \
            '' \
            '📊 تحليل أزواج OKX Spot ومتابعة حركة السوق.' \
            '📈 إشارات تداول مع سعر دخول LIMIT ومستويات TP وSL.' \
            '🔔 متابعة الأوامر المعلقة والمنفذة ونتائج الصفقات الرابحة.' \
            '📰 تنبيهات الأخبار المهمة ومخاطر السوق.' \
            '📊 لوحة أداء وإحصائيات للاستراتيجيات.' \
            '🧪 تداول ورقي لمحاكاة الصفقات دون تنفيذ تداولات حقيقية.' \
            '' \
            '🧠 متابعة وتحليل السوق على مدار اليوم.' \
            '💎 اشترك في الباقة الشهرية مقابل 25$ واستفد من مزايا Zied Quant Traide.' \
            '📩 للاشتراك والتفاصيل: @ziedbns2' \
            '')

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHANNEL_ID}" \
            --data-urlencode "text=${MESSAGE}")

          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print("Telegram response:", d.get("description", "ok")); sys.exit(0 if d.get("ok") else 1)'
